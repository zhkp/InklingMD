[package]
name = "inklingmd"
version = "3.3.0"
description = "A WYSIWYG Markdown editor"
authors = ["zhkp"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "inklingmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
regex = "1"
base64 = "0.22"
# 工作区文件索引与 .gitignore 解析（与 ripgrep 同源实现，#227）
ignore = "0.4"
# Smart Paste 远程图片下载（#220）：rustls + ring（不依赖 aws-lc 的 cmake/NASM 构建链），
# 证书校验走系统信任库；与 tauri 已依赖的 reqwest 同版本，不引入第二份 HTTP 栈
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# assets 目录内容哈希去重（#220）
sha2 = "0.10"

# 单实例插件：仅桌面端，移动端不引入
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
