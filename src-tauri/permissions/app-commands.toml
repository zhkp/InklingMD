# app 自定义 command 的 ACL 权限定义
# Tauri v2 对所有 command（含 app 自定义 command）强制 ACL 校验，
# 但 app command 的权限标识符不会自动生成，必须在此显式定义，
# 再由 capabilities/default.json 引用。
#
# 定义格式：identifier 用 allow-<command 名的 kebab-case 形式>（如 search_in_workspace
# → allow-search-in-workspace），commands.allow 填 command 函数名原样（下划线保留，
# 即 invoke_handler 注册的名字）。
#
# 例外：命令名本身以 `allow_` 开头时去掉该前缀再拼 —— allow_asset_dir → allow-asset-dir
# （而不是 allow-allow-asset-dir）。tests/unit/capabilities.test.ts 的 permissionIdOf
# 与本规则逐字对应，改一处必须同步改另一处。
"$schema" = "schemas/schema.json"

# 文件系统命令
[[permission]]
identifier = "allow-list-dir"
description = "Allow list_dir command"
commands.allow = ["list_dir"]

[[permission]]
identifier = "allow-read-text-file"
description = "Allow read_text_file command"
commands.allow = ["read_text_file"]

# 导出资源可移植化（#372）：读取本地二进制资源字节。
# 后端实现复用 asset 协议运行时白名单，白名单外路径一律拒绝。
[[permission]]
identifier = "allow-read-binary-file"
description = "Allow read_binary_file command"
commands.allow = ["read_binary_file"]

[[permission]]
identifier = "allow-write-text-file"
description = "Allow write_text_file command"
commands.allow = ["write_text_file"]

[[permission]]
identifier = "allow-write-binary-file"
description = "Allow write_binary_file command"
commands.allow = ["write_binary_file"]

[[permission]]
identifier = "allow-file-mtime"
description = "Allow file_mtime command"
commands.allow = ["file_mtime"]

[[permission]]
identifier = "allow-rename-path"
description = "Allow rename_path command"
commands.allow = ["rename_path"]

[[permission]]
identifier = "allow-delete-path"
description = "Allow delete_path command"
commands.allow = ["delete_path"]

[[permission]]
identifier = "allow-create-file"
description = "Allow create_file command"
commands.allow = ["create_file"]

[[permission]]
identifier = "allow-create-dir"
description = "Allow create_dir command"
commands.allow = ["create_dir"]

[[permission]]
identifier = "allow-asset-dir"
description = "Allow allow_asset_dir command"
commands.allow = ["allow_asset_dir"]

# Smart Paste 远程图片落盘（#220）：下载远程图片 + assets 目录内容哈希查重
[[permission]]
identifier = "allow-download-remote-image"
description = "Allow download_remote_image command"
commands.allow = ["download_remote_image"]

[[permission]]
identifier = "allow-find-asset-by-hash"
description = "Allow find_asset_by_hash command"
commands.allow = ["find_asset_by_hash"]

# 全局搜索命令
[[permission]]
identifier = "allow-search-in-workspace"
description = "Allow search_in_workspace command"
commands.allow = ["search_in_workspace"]

# 工作区文件索引命令（#227：Quick Open 的索引地基，全局搜索的 ignore 规则同源）
[[permission]]
identifier = "allow-list-workspace-files"
description = "Allow list_workspace_files command"
commands.allow = ["list_workspace_files"]

# Pandoc 导出命令
[[permission]]
identifier = "allow-pandoc-check"
description = "Allow pandoc_check command"
commands.allow = ["pandoc_check"]

[[permission]]
identifier = "allow-pandoc-export-docx"
description = "Allow pandoc_export_docx command"
commands.allow = ["pandoc_export_docx"]

# 待打开文件命令
[[permission]]
identifier = "allow-take-pending-file"
description = "Allow take_pending_file command"
commands.allow = ["take_pending_file"]

# 主题导入的 IO 命令（#307）：扫描主题目录 / 递归复制 / 压缩包解压 / 预装源副本目录
[[permission]]
identifier = "allow-scan-theme-dir"
description = "Allow scan_theme_dir command"
commands.allow = ["scan_theme_dir"]

[[permission]]
identifier = "allow-copy-path"
description = "Allow copy_path command"
commands.allow = ["copy_path"]

[[permission]]
identifier = "allow-extract-zip"
description = "Allow extract_zip command"
commands.allow = ["extract_zip"]

[[permission]]
identifier = "allow-resource-themes-dir"
description = "Allow resource_themes_dir command"
commands.allow = ["resource_themes_dir"]

# 应用数据根（#404）：便携模式的数据落点由 Rust 解析，前端不得自己猜 Roaming
[[permission]]
identifier = "allow-app-data-root"
description = "Allow app_data_root command"
commands.allow = ["app_data_root"]

[[permission]]
identifier = "allow-take-portable-migration"
description = "Allow take_portable_migration command"
commands.allow = ["take_portable_migration"]

# #404 复核：以下命令注册进 invoke_handler 但漏了 ACL 权限，
# 运行时一律被拦截（实测 `Command save_document not allowed by ACL`），
# 与 #362/#365 声称的能力不符。ACL 白名单必须与 invoke_handler 同步。
[[permission]]
identifier = "allow-list-dir-files"
description = "Allow list_dir_files command"
commands.allow = ["list_dir_files"]

[[permission]]
identifier = "allow-file-stat"
description = "Allow file_stat command"
commands.allow = ["file_stat"]

# 成对读取与写盘（#362）：保存链路的唯一入口
[[permission]]
identifier = "allow-read-document"
description = "Allow read_document command"
commands.allow = ["read_document"]

[[permission]]
identifier = "allow-save-document"
description = "Allow save_document command"
commands.allow = ["save_document"]

# 恢复区写入（#362/#365）：草稿、会话标记、崩溃归档
[[permission]]
identifier = "allow-write-recovery-file"
description = "Allow write_recovery_file command"
commands.allow = ["write_recovery_file"]

# 恢复区读取（#409 配额片）：草稿正文按 10MB 计，序列化后超过文档通道的 10MB 护栏。
# 读取命令自带恢复区路径守卫，只允许 recovery/ 子树。
[[permission]]
identifier = "allow-read-recovery-file"
description = "Allow read_recovery_file command"
commands.allow = ["read_recovery_file"]
