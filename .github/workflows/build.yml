name: Build

# 触发范围：main 推送、v* tag、PR、手动
# PR 只跑 test job（双平台单测 / Rust 单测 / E2E，见 #252），打包 job 在 PR 上显式跳过——
# 打包成本高且 fork PR 的产物无发布用途，打包仍只在 main / tag / 手动时执行
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# 创建 Release、上传产物需要 contents: write 权限
permissions:
  contents: write

jobs:
  # 共享测试 job：单元/组件测试 + Playwright E2E
  # 平台无关（浏览器 mock 模式 + 纯函数单测），在 Windows + Linux 双平台矩阵上跑，
  # 防止只在某一平台通过；Windows/Linux 构建均依赖此 job 通过
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Run unit & component tests
        run: pnpm test

      # Rust 单测：commands 与 lib 的 #[cfg(test)] 模块（#47/#48 新增覆盖）
      # 平台无关，随 test job 矩阵在 Windows + Linux 双平台跑
      - name: Install Tauri Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      # Linux 下装系统依赖需 root；sudo 会重置 PATH 找不到 pnpm，
      # 用 sudo env 透传当前 PATH（否则 "sudo: pnpm: command not found"）
      - name: Install Playwright system deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo env "PATH=$PATH" pnpm exec playwright install-deps chromium

      - name: Run E2E tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7

  # Windows 构建：NSIS exe + MSI + 便携 zip
  # PR 上跳过打包（#252）：PR 门禁只需 test job，此处显式跳过避免付打包成本
  build-windows:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Prepare portable zip
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $portableDir = "src-tauri/target/release/portable-build"
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item src-tauri/target/release/InklingMD.exe "$portableDir/InklingMD.exe"
          # 便携模式标记文件：存在则启用绿色模式，数据写入同目录 data 文件夹
          Set-Content -Path "$portableDir/portable.txt" -Value "This marker file enables portable mode. Keep it next to InklingMD.exe. App data will be stored in the 'data' folder beside the exe."
          Compress-Archive -Path "$portableDir/*" -DestinationPath "src-tauri/target/release/InklingMD-${version}-portable.zip" -Force
          Write-Host "Portable zip: InklingMD-${version}-portable.zip"

      # 扁平拷贝到 staging 目录再上传，确保下载后安装包位于 artifact 根目录
      # （upload-artifact 会保留原 bundle 子目录层级，导致 release 的扁平 glob 匹配失败）
      - name: Stage installers for artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path windows-installers -Force | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe windows-installers/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi windows-installers/
          Copy-Item src-tauri/target/release/InklingMD-*-portable.zip windows-installers/

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: InklingMD-windows-installers
          path: windows-installers
          if-no-files-found: error

  # Linux amd64 构建：AppImage + deb
  # PR 上跳过打包（#252）：同上，PR 门禁只需 test job
  build-linux:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Tauri 2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            librsvg2-bin \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 显式只构建 appimage + deb，避免 rpm bundler 缺少依赖导致失败
      - name: Build Tauri app
        run: pnpm tauri build --bundles appimage,deb

      # 扁平拷贝到 staging 目录再上传，确保下载后安装包位于 artifact 根目录
      - name: Stage installers for artifact
        run: |
          mkdir -p linux-installers
          cp src-tauri/target/release/bundle/appimage/*.AppImage linux-installers/
          cp src-tauri/target/release/bundle/deb/*.deb linux-installers/

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: InklingMD-linux-installers
          path: linux-installers
          if-no-files-found: error

  # 发版前置校验：仅 tag 推送时执行，拦截「忘更文档 / 版本号不同步」的发版
  # 平时 push main / PR 不跑，不影响日常开发提交
  release-guard:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # 校验 package.json / tauri.conf.json / Cargo.toml / Cargo.lock 四处版本一致，
      # 且 tag 名与代码版本一致
      - name: Check version consistency
        run: node scripts/check-version.mjs --tag=${{ github.ref_name }}

      # 校验自上一个 tag 以来的变更：有代码变更则 CHANGELOG/README/docs 至少一处已更新
      - name: Check docs updated since last release
        run: |
          PREV_TAG=$(git tag --sort=-v:refname --list 'v*' | grep -v "^${{ github.ref_name }}$" | head -n 1 || true)
          if [ -z "$PREV_TAG" ]; then
            echo "无历史 tag，跳过文档同步校验"
          else
            echo "上一个 tag：$PREV_TAG"
            node scripts/check-docs-updated.mjs --base="$PREV_TAG" --head=HEAD
          fi

  # 发布：tag 推送时下载 Windows + Linux 全部产物，附加到同一个 GitHub Release
  # 独立 job 避免两个 build job 并发创建 Release 的竞争
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux, release-guard]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -maxdepth 3 | sort

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/InklingMD-windows-installers/*.exe
            artifacts/InklingMD-windows-installers/*.msi
            artifacts/InklingMD-windows-installers/*.zip
            artifacts/InklingMD-linux-installers/*.AppImage
            artifacts/InklingMD-linux-installers/*.deb
          generate_release_notes: true
          fail_on_unmatched_files: true
