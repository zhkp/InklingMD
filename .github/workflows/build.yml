name: Build

# 触发范围：main 推送、v* tag、PR、手动
# PR 只跑 test job（双平台单测 / Rust 单测 / E2E，见 #252），打包 job 在 PR 上显式跳过——
# 打包成本高且 fork PR 的产物无发布用途，打包仍只在 main / tag / 手动时执行
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# 创建 Release、上传产物需要 contents: write 权限
permissions:
  contents: write

jobs:
  # 共享测试 job：单元/组件测试 + Playwright E2E
  # 平台无关（浏览器 mock 模式 + 纯函数单测），在 Windows + Linux 双平台矩阵上跑，
  # 防止只在某一平台通过；Windows/Linux 构建均依赖此 job 通过
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Run unit & component tests
        run: pnpm test

      # 预装主题的门禁（#308 §3.3 + §4.2）：许可登记完整性 / 两侧 slug 集合一致 /
      # 随包实物字节与 sha256 / 体积预算。脚本 exit 1 即阻断（不是口头约定）。
      - name: Check bundled theme licenses & budgets
        run: |
          pnpm check:theme-licenses
          pnpm check:theme-manifest
          # 生成物必须与提交一致（#318）：手改随包 NOTICE / THIRD-PARTY.md 也会在这里被拦下
          pnpm check:theme-notice-drift

      # Rust 单测：commands 与 lib 的 #[cfg(test)] 模块（#47/#48 新增覆盖）
      # 平台无关，随 test job 矩阵在 Windows + Linux 双平台跑
      - name: Install Tauri Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      # Linux 下装系统依赖需 root；sudo 会重置 PATH 找不到 pnpm，
      # 用 sudo env 透传当前 PATH（否则 "sudo: pnpm: command not found"）
      - name: Install Playwright system deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo env "PATH=$PATH" pnpm exec playwright install-deps chromium

      - name: Run E2E tests
        run: pnpm e2e

      # #224 A-5：门禁第三段——清空 dist 后重新构建，再做 S16 产物级层化断言
      # （不得对陈旧 dist 断言；check:build-layers 内部先删 dist 再 vite build）
      - name: Build frontend and verify layered CSS assets (S16)
        run: pnpm check:build-layers

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7

  # Windows 构建：NSIS exe + MSI + 便携 zip
  # PR 上跳过打包（#252）：PR 门禁只需 test job，此处显式跳过避免付打包成本
  build-windows:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Prepare portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $portableDir = "src-tauri/target/release/portable-build"
          if (Test-Path $portableDir) { Remove-Item -Path $portableDir -Recurse -Force }
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item src-tauri/target/release/InklingMD.exe "$portableDir/InklingMD.exe"
          # 便携版 resource_dir() 指向 exe 同目录，主题源副本必须位于 themes/。
          Copy-Item -Path "src-tauri/resources/themes" -Destination "$portableDir/themes" -Recurse
          # 便携模式标记文件：存在则启用绿色模式，数据写入同目录 data 文件夹
          Set-Content -Path "$portableDir/portable.txt" -Value "This marker file enables portable mode. Keep it next to InklingMD.exe. All app data (themes, recovery, WebView2 cache) is stored in the 'data' folder beside the exe. Removing this file switches back to the system AppData location, but the data already written here is NOT moved back automatically - copy it yourself before removing the marker."
          $portableZip = "src-tauri/target/release/InklingMD-${version}-portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -Force
          Write-Host "Portable zip: $portableZip"
          $portableAuditDir = Join-Path $env:RUNNER_TEMP "inkling-portable-zip-audit"
          if (Test-Path $portableAuditDir) { Remove-Item -Path $portableAuditDir -Recurse -Force }
          New-Item -ItemType Directory -Path $portableAuditDir -Force | Out-Null
          Expand-Archive -LiteralPath $portableZip -DestinationPath $portableAuditDir -Force
          $themesDir = Join-Path $portableAuditDir "themes"
          if (-not (Test-Path -LiteralPath (Join-Path $themesDir "manifest.json") -PathType Leaf)) { throw "便携 ZIP 根目录缺少 themes/manifest.json" }
          if (-not (Test-Path -LiteralPath (Join-Path $themesDir "NOTICE") -PathType Leaf)) { throw "便携 ZIP 根目录缺少 themes/NOTICE" }
          $expectedManifest = (Resolve-Path "src-tauri/resources/themes/manifest.json").Path
          & node "scripts/check-bundled-theme-artifact.mjs" $portableAuditDir $expectedManifest
          if ($LASTEXITCODE -ne 0) { throw "便携 ZIP 主题资源核对失败" }

      # #404：便携包的自我描述是「数据随身、不污染系统目录」，判据必须是**真实写盘落点**：
      #   exe 同级 data/themes ← 预装主题运行时副本、data/recovery ← 会话标记，
      #   且 %APPDATA%\com.inklingmd.editor 一条都不能出现。只读代码不算验收通过。
      - name: Run portable app and verify data lands beside the exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $roamingRoot = Join-Path $env:APPDATA "com.inklingmd.editor"
          if (Test-Path -LiteralPath $roamingRoot) { Remove-Item -LiteralPath $roamingRoot -Recurse -Force }
          if (Test-Path -LiteralPath $roamingRoot) { throw "运行时验收必须从无 Roaming 数据目录的干净环境开始" }
          $portableAuditDir = Join-Path $env:RUNNER_TEMP "inkling-portable-zip-audit"
          $dataDir = Join-Path $portableAuditDir "data"
          if (Test-Path -LiteralPath $dataDir) { Remove-Item -LiteralPath $dataDir -Recurse -Force }
          $evidenceDir = Join-Path $env:RUNNER_TEMP "inkling-portable-runtime-evidence"
          if (Test-Path -LiteralPath $evidenceDir) { Remove-Item -LiteralPath $evidenceDir -Recurse -Force }
          New-Item -ItemType Directory -Path $evidenceDir -Force | Out-Null
          $webView2PolicyPath = "HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          $policyKeyExisted = Test-Path -LiteralPath $webView2PolicyPath
          New-Item -Path $webView2PolicyPath -Force | Out-Null
          $previousPolicy = Get-ItemProperty -Path $webView2PolicyPath -Name "InklingMD.exe" -ErrorAction SilentlyContinue
          $hadPreviousPolicy = $null -ne $previousPolicy
          if ($hadPreviousPolicy) { $previousPolicyValue = $previousPolicy."InklingMD.exe" }
          New-ItemProperty -Path $webView2PolicyPath -Name "InklingMD.exe" -Value "--remote-debugging-port=9222" -PropertyType String -Force | Out-Null
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9222"
          $portableExe = Join-Path $portableAuditDir "InklingMD.exe"
          if (-not (Test-Path -LiteralPath $portableExe -PathType Leaf)) { throw "ZIP 解包目录中缺少 InklingMD.exe: $portableExe" }
          $expectedManifest = Join-Path $env:GITHUB_WORKSPACE "src-tauri/resources/themes/manifest.json"
          if (-not (Test-Path -LiteralPath $expectedManifest -PathType Leaf)) { throw "缺少仓库源主题清单: $expectedManifest" }
          $app = $null
          try {
            $app = Start-Process -FilePath $portableExe -WorkingDirectory $portableAuditDir -PassThru
            & node "scripts/probe-portable-bundled-themes.mjs" $evidenceDir $expectedManifest "9222"
            if ($LASTEXITCODE -ne 0) { throw "便携版首次启动主题验收失败" }
            # 判据一：预装主题的运行时副本落在 exe 同级 data/themes（清单驱动，不写死清单）
            $manifest = Get-Content -LiteralPath $expectedManifest -Raw | ConvertFrom-Json
            if (-not $manifest.themes -or $manifest.themes.Count -eq 0) { throw "源主题清单缺少 themes 数组，落点判据无法执行" }
            $themesDir = Join-Path $dataDir "themes"
            foreach ($entry in $manifest.themes) {
              $cssPath = Join-Path $themesDir ($entry.css -replace '/', '\')
              if (-not (Test-Path -LiteralPath $cssPath -PathType Leaf)) {
                throw "便携模式主题未落在 exe 同级 data/themes：缺少 $($entry.css)（slug=$($entry.slug)）"
              }
            }
            # 判据二：恢复区（会话标记）同样在便携目录
            $sessionMarker = Join-Path $dataDir "recovery/main/session.json"
            if (-not (Test-Path -LiteralPath $sessionMarker -PathType Leaf)) {
              throw "便携模式恢复区未落在 exe 同级 data/recovery：缺少 main/session.json"
            }
            # 判据三：系统目录不得被污染（Roaming 里一条都不该出现）
            if (Test-Path -LiteralPath $roamingRoot) {
              $polluted = Get-ChildItem -LiteralPath $roamingRoot -Recurse -Force | Select-Object -First 20 | ForEach-Object { $_.FullName }
              throw "便携模式仍写系统目录：$roamingRoot 被创建。内容：$($polluted -join '; ')"
            }
            "PASS portable data location: $themesDir + data/recovery，Roaming 未被创建" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } finally {
            if ($null -ne $app) {
              $app.Refresh()
              if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
              else { Write-Host "InklingMD.exe exited during probe; exit code: $($app.ExitCode)" }
            }
            if ($hadPreviousPolicy) {
              Set-ItemProperty -Path $webView2PolicyPath -Name "InklingMD.exe" -Value $previousPolicyValue
            } else {
              Remove-ItemProperty -Path $webView2PolicyPath -Name "InklingMD.exe" -ErrorAction SilentlyContinue
              if (-not $policyKeyExisted) { Remove-Item -LiteralPath $webView2PolicyPath -Force -ErrorAction SilentlyContinue }
            }
          }

      # #403：检查每一种实际交付包，而不是只检查仓库源文件或 bundle 输出目录。
      # 任一解包工具 / 包格式不可用都显式失败；不允许静默跳过。
      - name: Verify bundled themes in every Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expectedManifest = (Resolve-Path "src-tauri/resources/themes/manifest.json").Path
          $script = "scripts/check-bundled-theme-artifact.mjs"
          $auditRoot = Join-Path $env:RUNNER_TEMP "inkling-theme-audit"
          if (Test-Path $auditRoot) { Remove-Item $auditRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $auditRoot -Force | Out-Null

          $portableFiles = @(Get-ChildItem "src-tauri/target/release/InklingMD-*-portable.zip" -File)
          if ($portableFiles.Count -eq 0) { throw "未生成便携 ZIP，无法完成 #403 包内对账" }
          foreach ($package in $portableFiles) {
            $destination = Join-Path $auditRoot ("portable-" + [IO.Path]::GetFileNameWithoutExtension($package.Name))
            Expand-Archive -LiteralPath $package.FullName -DestinationPath $destination -Force
            & node $script $destination $expectedManifest
            if ($LASTEXITCODE -ne 0) { throw "便携包主题资源核对失败：$($package.Name)" }
            "PASS portable ZIP: $($package.Name)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

          $nsisFiles = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -File)
          if ($nsisFiles.Count -eq 0) { throw "未生成 NSIS 安装包，无法完成 #403 包内对账" }
          foreach ($package in $nsisFiles) {
            $destination = Join-Path $auditRoot ("nsis-" + $package.BaseName)
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            # NSIS /S + /D=... 安装到 runner 临时目录，不启动应用。
            $process = Start-Process -FilePath $package.FullName -ArgumentList @("/S", "/D=$destination") -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "NSIS 静默解包失败（exit $($process.ExitCode)）：$($package.Name)" }
            & node $script $destination $expectedManifest
            if ($LASTEXITCODE -ne 0) { throw "NSIS 包主题资源核对失败：$($package.Name)" }
            "PASS NSIS: $($package.Name)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

          $msiFiles = @(Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -File)
          if ($msiFiles.Count -eq 0) { throw "未生成 MSI 安装包，无法完成 #403 包内对账" }
          foreach ($package in $msiFiles) {
            $destination = Join-Path $auditRoot ("msi-" + $package.BaseName)
            $arguments = @("/a", "`"$($package.FullName)`"", "/qn", "/norestart", "TARGETDIR=`"$destination`"")
            $process = Start-Process -FilePath "msiexec.exe" -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "MSI 管理性解包失败（exit $($process.ExitCode)）：$($package.Name)" }
            & node $script $destination $expectedManifest
            if ($LASTEXITCODE -ne 0) { throw "MSI 包主题资源核对失败：$($package.Name)" }
            "PASS MSI: $($package.Name)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      # 扁平拷贝到 staging 目录再上传，确保下载后安装包位于 artifact 根目录
      # （upload-artifact 会保留原 bundle 子目录层级，导致 release 的扁平 glob 匹配失败）
      - name: Stage installers for artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path windows-installers -Force | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe windows-installers/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi windows-installers/
          Copy-Item src-tauri/target/release/InklingMD-*-portable.zip windows-installers/

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: InklingMD-windows-installers
          path: windows-installers
          if-no-files-found: error

      - name: Upload portable runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-theme-runtime-evidence
          path: ${{ runner.temp }}/inkling-portable-runtime-evidence/
          if-no-files-found: warn

  # Linux amd64 构建：AppImage + deb
  # PR 上跳过打包（#252）：同上，PR 门禁只需 test job
  build-linux:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Tauri 2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            librsvg2-bin \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 显式只构建 appimage + deb，避免 rpm bundler 缺少依赖导致失败
      - name: Build Tauri app
        run: pnpm tauri build --bundles appimage,deb

      # #403：deb 用 dpkg-deb 解包；AppImage 用其自带 --appimage-extract 模式解包。
      # 任一工具缺失或任一格式没产物都显式失败，并写明本 job 的覆盖情况。
      - name: Verify bundled themes in every Linux package
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dpkg-deb >/dev/null 2>&1; then
            echo "FAIL: dpkg-deb 不可用，未验证 deb 包" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          expected_manifest="src-tauri/resources/themes/manifest.json"
          audit_root="$RUNNER_TEMP/inkling-theme-audit"
          rm -rf "$audit_root"
          mkdir -p "$audit_root"
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if ((${#debs[@]} == 0)); then
            echo "FAIL: 未生成 deb，无法完成 #403 包内对账" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ((${#appimages[@]} == 0)); then
            echo "FAIL: 未生成 AppImage，无法完成 #403 包内对账" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          for package in "${debs[@]}"; do
            destination="$audit_root/deb-$(basename "$package" .deb)"
            mkdir -p "$destination"
            dpkg-deb -x "$package" "$destination"
            node scripts/check-bundled-theme-artifact.mjs "$destination" "$expected_manifest"
            echo "PASS deb: $(basename "$package")" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          for package in "${appimages[@]}"; do
            destination="$audit_root/appimage-$(basename "$package" .AppImage)"
            mkdir -p "$destination"
            chmod +x "$package"
            absolute_package="$(realpath "$package")"
            (cd "$destination" && "$absolute_package" --appimage-extract >/dev/null)
            node scripts/check-bundled-theme-artifact.mjs "$destination/squashfs-root" "$expected_manifest"
            echo "PASS AppImage: $(basename "$package")" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      # 扁平拷贝到 staging 目录再上传，确保下载后安装包位于 artifact 根目录
      - name: Stage installers for artifact
        run: |
          mkdir -p linux-installers
          cp src-tauri/target/release/bundle/appimage/*.AppImage linux-installers/
          cp src-tauri/target/release/bundle/deb/*.deb linux-installers/

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: InklingMD-linux-installers
          path: linux-installers
          if-no-files-found: error

  # 发版前置校验：仅 tag 推送时执行，拦截「忘更文档 / 版本号不同步」的发版
  # 平时 push main / PR 不跑，不影响日常开发提交
  release-guard:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # 校验 package.json / tauri.conf.json / Cargo.toml / Cargo.lock 四处版本一致，
      # 且 tag 名与代码版本一致
      - name: Check version consistency
        run: node scripts/check-version.mjs --tag=${{ github.ref_name }}

      # 校验自上一个 tag 以来的变更：有代码变更则 CHANGELOG/README/docs 至少一处已更新
      # #302（PR #329 复核阻塞项）：「上一个 tag」的判定与「是否允许跳过」全在脚本里 ——
      # workflow 不再用 bash 分支（旧的 `|| true` + `[ -z "$PREV_TAG" ] → exit 0` 会把
      # 「tag 没 fetch 到」也当成「首个版本」静默跳过）。脚本内部用 --is-shallow-repository
      # 区分「浅克隆没 tag」与「完整克隆真无 tag」。
      # #334：**本步骤的「首个发布跳过」要求 tag 齐全** —— 只有 `fetch-depth: 0` 的**完整克隆**
      # （全分支 + 全部 tag）才满足；`--single-branch` 或手写部分 fetch 虽然**不是**浅克隆，
      # 但 tag 列表同样不全，会把真实违规吞成「首个发布」。脚本现在会在跳过前用
      # `git ls-remote --tags origin` 核对，远端有本地没有的 tag ⇒ 直接 fail（别再改成部分 fetch）。
      - name: Check docs updated since last release
        run: node scripts/check-docs-updated.mjs --head=HEAD

  # 发布：tag 推送时下载 Windows + Linux 全部产物，附加到同一个 GitHub Release
  # 独立 job 避免两个 build job 并发创建 Release 的竞争
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux, release-guard]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -maxdepth 3 | sort

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/InklingMD-windows-installers/*.exe
            artifacts/InklingMD-windows-installers/*.msi
            artifacts/InklingMD-windows-installers/*.zip
            artifacts/InklingMD-linux-installers/*.AppImage
            artifacts/InklingMD-linux-installers/*.deb
          generate_release_notes: true
          fail_on_unmatched_files: true
