name: Benchmark

# 本独立 Benchmark workflow 在 main 目标分支的 PR 上运行；
# build.yml 对 opened/synchronize/reopened 的 PR 运行，并以 Windows + Linux 矩阵执行 test job。
# build-windows / build-linux 两个 Tauri 打包 job 显式排除 PR，避免每个 PR 承担打包成本；
# release-guard / release 仍只在 tag 上执行。
# tests/unit/workflow-triggers.test.ts 静态校验两者的触发条件和打包跳过条件。
#
# 测量声明（防「CI 说没回归、用户说卡」的扯皮）：
# - 运行时 = Playwright chromium + vite dev server（未压缩、含 HMR），绝对值不代表生产构建
# - CI 无 GPU、仅 ubuntu-latest，测量值只用于同环境纵向对比
# - 真机 WebView2 / WKWebView 表现仍是发版前人工验证项

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      profile:
        description: "档位（quick = 1k/5k 行；full = 含 2 万行）"
        required: false
        default: "quick"
        type: choice
        options:
          - quick
          - full
      update_baseline:
        description: "用本次结果重建 baseline（CI 首次启用、或 fixture/环境变更后需要）"
        required: false
        default: false
        type: boolean
      absolute:
        description: "启用绝对阈值判定（默认关闭：CI 无 GPU 且 vsync 锁 60Hz，绝对结论反映 runner 而非代码）"
        required: false
        default: false
        type: boolean
      force_suspects:
        description: "调试用：强制把指定场景当作「疑似回归」（逗号分隔，如 open-S-rich），用于确定性演练「移交 + 独立复测 job」两段路径"
        required: false
        default: ""
        type: string
      force_suspects2:
        description: "调试用：强制把指定场景当作「确认轮候选」（逗号分隔），用于确定性演练第三个 retest2 job 与 -retest2 产物（需同时填 force_suspects 才会走到确认轮）"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# 串行化本工作流的**所有**运行（issue #291）：共享 runner 争用会让并发窗口内的首轮与复测
# **双双**被拖慢（实测先例：同一份代码在并发窗口里 88% 的相对行同时变差），双超阈值直接穿透
# #234 的独立 retest 防线，产出假 FAIL——2026-09-30 main 与 PR #289 各一例，换 runner 静默
# 复跑全部证伪（-20.2% / +4.5%，均 PASS）。
# - group 用**静态名**（不含 ref）→ 跨 PR / main / tag 全局串行；
# - queue: max + cancel-in-progress: false → 同组最多 1 个运行中，其余按入队先后**排队执行**
#   （最多 100 个 pending，FIFO，排队中的运行**不会**被新入队者顶掉）——发版验证 / 播种绝不丢失。
# ⚠️ 边界（官方语义）：队列满（100）时**新入队者**被取消；FIFO 以「开始等待的时刻」而非触发时刻
#     排序，故不保证严格顺序。重要运行（tag / 播种）仍建议在安静窗口触发，避免排在长队之后。
# 注：`queue: max` 与 `cancel-in-progress: true` 互斥（同时写会触发 workflow 校验错误）。
concurrency:
  group: benchmark
  queue: max
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # PR 运行保持「不阻断合并」（issue #216 硬要求：只提示、不门禁）；
    # tag 运行是**发版验证**，必须显式失败——否则"回归复现"与"根本没比出结论"都会被绿勾掩盖。
    # tag 运行不会影响 build.yml 的 release job（两者是独立工作流），这里只控制本工作流的结论。
    continue-on-error: ${{ github.ref_type != 'tag' }}
    outputs:
      # 有疑似回归时把复测交给下面独立的 retest job（新 runner），见 jobs.retest 的说明
      suspects: ${{ steps.verdict.outputs.suspects }}
      profile: ${{ steps.profile.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Install Playwright system deps
        shell: bash
        # sudo 会重置 PATH 导致找不到 pnpm，用 sudo env 透传（与 build.yml 一致）
        run: sudo env "PATH=$PATH" pnpm exec playwright install-deps chromium

      - name: 决定档位
        id: profile
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.profile }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=full" >> "$GITHUB_OUTPUT"
          else
            echo "value=quick" >> "$GITHUB_OUTPUT"
          fi

      - name: Run benchmark
        env:
          PERF_PROFILE: ${{ steps.profile.outputs.value }}
          CI: "true"
          # 不硬编码 0：留空表示"不覆盖默认策略"。CI 是 headless，默认策略本就不产出绝对判定
          # （vsync 锁 60Hz，绝对结论衡量 runner 而非代码；实测同代码两轮 jankRate 21.7% vs <10%）。
          # 相对回归判定（median / p95 / jank 对 baseline）在 CI 全量保留。
          # 需要绝对结论时勾选 absolute 输入，或本地用 PERF_HEADED=1 / PERF_UNCAPPED=1 跑。
          PERF_ABSOLUTE: ${{ github.event.inputs.absolute == 'true' && '1' || '' }}
          # tag 运行（发版验证）必须真的和基线比出结论：覆盖不足时 report 退出 2（不构成性能验证）
          PERF_REQUIRE_COMPARISON: ${{ github.ref_type == 'tag' && '1' || '' }}
          # 拆出独立复测 job（issue #234）：同 runner 顺序复测无法过滤"整台 runner 变慢"的会话，
          # 慢会话会让首轮与复测同时超阈值、穿过「连续 2 次」过滤。有嫌疑时本 job 只测+check，
          # 复测与 final 判定交给 retest job 在新 runner 上跑。
          PERF_SPLIT_RETEST: "1"
          # 调试钩子：让「移交 + 独立复测 job」两段路径可被确定性演练（默认空=不强制）
          PERF_FORCE_SUSPECTS: ${{ github.event.inputs.force_suspects }}
        run: |
          if [ "${{ github.event.inputs.update_baseline }}" = "true" ]; then
            pnpm run benchmark -- --update-baseline=1
          else
            pnpm run benchmark
          fi

      # 判定是否需要独立复测 job：retest.json 有内容即为"有嫌疑"
      - name: 判定是否需要独立复测
        id: verdict
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # 必须显式判数组：非数组 JSON 时 `.length` 是 undefined，`[ "undefined" -gt 0 ]` 会让
          # 整个步骤报错 → suspects 输出为空 → 复测被静默跳过，而 PR 运行还有 continue-on-error 掩盖成绿。
          N=$(node -e "const p='.perf-output/retest.json';let l=null;try{l=JSON.parse(require('fs').readFileSync(p,'utf8'))}catch{};console.log(Array.isArray(l)?l.length:0)")
          echo "疑似场景数=$N"
          if [ "$N" -gt 0 ]; then
            echo "suspects=true" >> "$GITHUB_OUTPUT"
          else
            echo "suspects=false" >> "$GITHUB_OUTPUT"
          fi

      # 退出码 1 = 回归复现，2 = infra 故障；两者都不阻断合并，但要留下产物供排查
      # 重建 baseline 时把 .perf-baseline/ 一并上传：CI 上的 baseline 需要人工取回并提交，
      # workflow 不自动 commit（避免给 CI 写仓库权限）
      #
      # include-hidden-files 必须为 true：.perf-output/ 与 .perf-baseline/ 都是点开头的隐藏目录，
      # upload-artifact v4+ 默认跳过隐藏文件——实测踩过「步骤显示 success 但零产物」的假绿灯。
      - name: Upload benchmark artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-benchmark-${{ steps.profile.outputs.value }}
          path: |
            .perf-output/
            .perf-baseline/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: 写入 Job Summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -f .perf-output/report.md ]; then
            COVERAGE=$(grep -oE '判定覆盖：[0-9]+/[0-9]+' .perf-output/report.md | head -1 || true)
            {
              echo "## 性能 Benchmark（档位：${{ steps.profile.outputs.value }}）"
              echo ""
              if [ -n "$COVERAGE" ]; then
                echo "**$COVERAGE**"
              fi
              # 覆盖面 banner：0/N 时「FAIL：0」会被误读成"没有回归"，必须点明
              case "$COVERAGE" in
                "判定覆盖：0/"*)
                  echo ""
                  echo "> ⚠️ **本次未与任何基线比较**：结论**不构成性能验证**。请先建立该档位基线（workflow_dispatch 勾选 update_baseline，取回产物后提交）。"
                  ;;
              esac
              echo ""
              cat .perf-output/report.md
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -f .perf-output/retest.json ]; then
            # 移交模式（issue #234）：本 job 只做测量 + check，final 判定在 retest job 里出
            {
              echo "## 性能 Benchmark（档位：${{ steps.profile.outputs.value }}）"
              echo ""
              echo "⏳ 检出疑似回归，复测与 final 判定已移交独立的 **retest job**（新 runner）——"
              echo "同 runner 顺序复测无法过滤「整台 runner 变慢」的会话（#234）。"
              echo ""
              echo "**疑似场景**："
              echo ""
              node -e "const l=JSON.parse(require('fs').readFileSync('.perf-output/retest.json','utf8'));console.log(l.map(x=>'- \`'+x+'\`').join('\n'))"
              echo ""
              echo "> ⚠️ 若本次是**播种**（\`update_baseline=true\`）：基线更新发生在 retest job，"
              echo "> 请取回 \`perf-benchmark-${{ steps.profile.outputs.value }}-retest\` 产物提交——"
              echo "> 本 job 的 \`perf-benchmark-${{ steps.profile.outputs.value }}\` 里仍是旧基线（取错＝本次播种静默丢失）。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ 未生成 .perf-output/report.md（benchmark 未跑完，属 infra 故障）" >> "$GITHUB_STEP_SUMMARY"
          fi

  # 独立复测 job（issue #234）：在**新的 runner** 上重测疑似场景。
  #
  # 为什么必须换 runner：首轮与复测在同一台 VM 上顺序执行时，「整台 runner 变慢」
  # （共享宿主机争用 / VM 放置差异）会让两轮同时超阈值，穿过「连续 2 次」判定——
  # 实测一次慢会话里 88% 的相对行同时变差、中位 Δ +18.7%，而同一份代码在安静时段完全正常。
  # 换 runner 后两轮才统计独立：慢会话通常不会在两台不同 VM 上重现。
  #
  # 只在有疑似回归时运行：无嫌疑的常规运行仍只有 1 个 job（不额外付启动与安装成本）。
  #
  # #294：本 job 现在还要做 confirm 相位，并在有确认候选时**移交 retest2 job**
  # （第三个 runner）而不自己出 final —— 两个会话仍可能被跨工作流并发同时拖慢。
  retest:
    needs: benchmark
    if: needs.benchmark.outputs.suspects == 'true'
    runs-on: ubuntu-latest
    # 与 benchmark job 同规则：PR 运行不阻断合并；tag 运行必须显式失败（否则红信号被绿勾掩盖）
    continue-on-error: ${{ github.ref_type != 'tag' }}
    outputs:
      # 有确认轮候选时把确认轮交给 retest2 job（第三个 runner），见 jobs.retest2 的说明
      suspects2: ${{ steps.confirm.outputs.suspects2 }}
      # 传下去给 retest2 job：它要用同一个 profile 跑第三轮与出报告
      profile: ${{ needs.benchmark.outputs.profile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # 上游 job 的产物：首轮采样 + 复测清单 + 基线（判定要用）
      - name: 下载首轮产物
        uses: actions/download-artifact@v7
        with:
          name: perf-benchmark-${{ needs.benchmark.outputs.profile }}

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Install Playwright system deps
        shell: bash
        # sudo 会重置 PATH 导致找不到 pnpm，用 sudo env 透传（与 benchmark job 一致）
        run: sudo env "PATH=$PATH" pnpm exec playwright install-deps chromium

      - name: 复测 + 判定是否需要确认轮（有确认候选时移交 retest2 job）
        env:
          PERF_PROFILE: ${{ needs.benchmark.outputs.profile }}
          CI: "true"
          PERF_ABSOLUTE: ${{ github.event.inputs.absolute == 'true' && '1' || '' }}
          PERF_REQUIRE_COMPARISON: ${{ github.ref_type == 'tag' && '1' || '' }}
          PERF_RETEST_ONLY: "1"
          # ⚠️ 这一行**不可省**（#294 评审 P0）：它决定 `planConfirmPhases` 是否返回 handoff。
          # 缺了它 splitRetest 恒为 false → 确认轮永不移交 → 第三轮跑在**与 R2 同一台 runner** 上
          # （实测会打印「本地为单进程」指纹），于是：① tag 运行以「同 runner 三轮」的假 FAIL 收尾，
          # 而 retest2 job 又因 retest job 非零被 skip —— 根治手段在 tag 路径上被整体旁路；
          # ② 确认轮白跑两遍；③ Job Summary 走「已出 final」分支，提示取 `-retest` 而非 `-retest2`
          # （播种时取错产物 = 静默丢失）。它同时是「基线取回哪个产物」叙事的单一事实来源，
          # 故不改 benchmark.mjs 去把 retestOnly 当 split —— 那样两者会分叉。
          PERF_SPLIT_RETEST: "1"
          PERF_FORCE_SUSPECTS: ${{ github.event.inputs.force_suspects }}
          # 确定性演练三段路径用（#294）：不填则候选由 confirm 相位真实算出
          PERF_FORCE_SUSPECTS2: ${{ github.event.inputs.force_suspects2 }}
        run: |
          if [ "${{ github.event.inputs.update_baseline }}" = "true" ]; then
            pnpm run benchmark -- --update-baseline=1
          else
            pnpm run benchmark
          fi

      # 判定是否需要第三个 job（#294）：retest2.json 有内容即为"有确认候选"。
      # 写法与上面读 retest.json 的步骤同款（显式判数组，非数组时长度是 undefined，
      # `[ "undefined" -gt 0 ]` 会让整步报错 → suspects2 为空 → 确认轮被静默跳过）。
      - name: 判定是否需要确认轮
        id: confirm
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          N=$(node -e "const p='.perf-output/retest2.json';let l=null;try{l=JSON.parse(require('fs').readFileSync(p,'utf8'))}catch{};console.log(Array.isArray(l)?l.length:0)")
          echo "确认轮候选数=$N"
          if [ "$N" -gt 0 ]; then
            echo "suspects2=true" >> "$GITHUB_OUTPUT"
          else
            echo "suspects2=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload benchmark artifact（含复测轮与确认轮清单）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-benchmark-${{ needs.benchmark.outputs.profile }}-retest
          path: |
            .perf-output/
            .perf-baseline/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: 写入 Job Summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -f .perf-output/report.md ]; then
            {
              echo "## 性能 Benchmark · 独立复测（新 runner，issue #234）"
              echo ""
              cat .perf-output/report.md
              echo ""
              # 播种场景下，基线更新（--update-baseline）发生在**跑到 final 的那个 job**，
              # 而操作者此刻看到的正是这个 Summary——必须就地下发取回目标，
              # 否则会去取上游 job 的产物（旧基线）→ 本次播种静默丢失。
              echo "> 📦 **取回产物（若本次是播种 \`update_baseline=true\`）**：基线已在**本 job** 更新，"
              echo "> 请取 **\`perf-benchmark-${{ needs.benchmark.outputs.profile }}-retest\`**；"
              echo "> 上游 \`perf-benchmark-${{ needs.benchmark.outputs.profile }}\` 里是**旧基线**（取错＝本次播种静默丢失）。"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -f .perf-output/retest2.json ]; then
            # 移交确认轮（#294）：本 job 只做「复测 + confirm」，final 在 retest2 job 里出
            {
              echo "## 性能 Benchmark · 独立复测（新 runner，issue #234）"
              echo ""
              echo "⏳ 复测后仍有 **R1∧R2 双超**或**复测标定越界**的场景，确认轮与 final 判定已移交 **retest2 job**（第三个 runner）——"
              echo "两个会话可能被跨工作流并发同时拖慢，双超不足以确认 FAIL（#294）。"
              echo ""
              echo "**确认轮候选**："
              echo ""
              node -e "const l=JSON.parse(require('fs').readFileSync('.perf-output/retest2.json','utf8'));console.log(Array.isArray(l)&&l.length?l.map(x=>'- \`'+x+'\`').join('\n'):'- （空）')"
              echo ""
              echo "> ⚠️ 若本次是**播种**（\`update_baseline=true\`）：基线更新发生在 retest2 job，"
              echo "> 请取回 \`perf-benchmark-${{ needs.benchmark.outputs.profile }}-retest2\` 产物提交——"
              echo "> 本 job 的 \`perf-benchmark-${{ needs.benchmark.outputs.profile }}-retest\` 里仍是旧基线（取错＝本次播种静默丢失）。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ 未生成 .perf-output/report.md（复测 job 未跑完，属 infra 故障）" >> "$GITHUB_STEP_SUMMARY"
          fi

  # 确认轮 job（issue #294）：在**第三个 runner** 上重测确认候选并出 final 判定。
  #
  # 为什么 #234 的两个 runner 还不够：共享 runner 池内的并发来源是**跨工作流**的
  # （自家 Build 的 test job、main 打包、其他 Benchmark），#291/#293 的 workflow 级串行
  # 管不到它们。2026-09-30 实证 3 例「首轮 + 复测双双超阈值」，换 runner 静默复跑全部证伪。
  # 根治办法：FAIL 必须由第三个、独立 runner 上的会话确认，且该会话自身标定越界时
  # **不允许**产出 FAIL（落 UNCONFIRMED，tag 运行 exit 2）。
  #
  # 只在有确认候选时运行：绝大多数 PR 的常规路径仍是 1~2 个 job，零额外开销。
  retest2:
    needs: retest
    if: needs.retest.outputs.suspects2 == 'true'
    runs-on: ubuntu-latest
    # 与前两个 job 同规则：PR 运行不阻断合并；tag 运行必须显式失败
    continue-on-error: ${{ github.ref_type != 'tag' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # 上游 retest job 的产物：首轮 + 复测两轮采样、确认轮候选清单、基线（判定全靠它）
      - name: 下载复测产物
        uses: actions/download-artifact@v7
        with:
          name: perf-benchmark-${{ needs.retest.outputs.profile }}-retest

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Install Playwright system deps
        shell: bash
        # sudo 会重置 PATH 导致找不到 pnpm，用 sudo env 透传（与 benchmark job 一致）
        run: sudo env "PATH=$PATH" pnpm exec playwright install-deps chromium

      - name: 确认轮 + final 判定（本 job 的 runner 与前两轮都不同）
        env:
          PERF_PROFILE: ${{ needs.retest.outputs.profile }}
          CI: "true"
          PERF_ABSOLUTE: ${{ github.event.inputs.absolute == 'true' && '1' || '' }}
          PERF_REQUIRE_COMPARISON: ${{ github.ref_type == 'tag' && '1' || '' }}
          PERF_RETEST2_ONLY: "1"
        run: |
          if [ "${{ github.event.inputs.update_baseline }}" = "true" ]; then
            pnpm run benchmark -- --update-baseline=1
          else
            pnpm run benchmark
          fi

      - name: Upload benchmark artifact（含确认轮与三轮 final 报告）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-benchmark-${{ needs.retest.outputs.profile }}-retest2
          path: |
            .perf-output/
            .perf-baseline/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: 写入 Job Summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -f .perf-output/report.md ]; then
            {
              echo "## 性能 Benchmark · 确认轮（第三个 runner，issue #294）"
              echo ""
              cat .perf-output/report.md
              echo ""
              # 与上游 job 同理：基线在**跑到 final 的这个 job** 更新，取回目标必须写在这里
              echo "> 📦 **取回产物（若本次是播种 \`update_baseline=true\`）**：基线已在**本 job** 更新，"
              echo "> 请取 **\`perf-benchmark-${{ needs.retest.outputs.profile }}-retest2\`**；"
              echo "> 上游两个产物里都是**旧基线**（取错＝本次播种静默丢失）。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ 未生成 .perf-output/report.md（确认轮 job 未跑完，属 infra 故障）" >> "$GITHUB_STEP_SUMMARY"
          fi
